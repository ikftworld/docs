openapi: 3.0.3
info:
  title: Banking API
  version: 1.0.0
  description: OpenAPI specification generated from Prisma schema

servers:
  - url: https://api.ikft.world/v1

paths:
  /accounts:
    get:
      summary: List all accounts
      responses:
        '200':
          description: List of accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Account'
    post:
      summary: Create a new account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Account'
      responses:
        '201':
          description: Created account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'

  /accounts/{id}:
    get:
      summary: Get account by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Account details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'

  /transactions:
    get:
      summary: List all transactions
      responses:
        '200':
          description: List of transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Transaction'

  /customers:
    get:
      summary: List all customers
      responses:
        '200':
          description: List of customers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Customer'

components:
  schemas:
    Account:
      type: object
      properties:
        id:
          type: string
        type:
          $ref: '#/components/schemas/AccountType'
        status:
          $ref: '#/components/schemas/AccountStatus'
        currency:
          type: string
        balance:
          type: number
          format: decimal
        transactions:
          type: array
          items:
            $ref: '#/components/schemas/Transaction'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        closedAt:
          type: string
          format: date-time
          nullable: true

    Transaction:
      type: object
      properties:
        id:
          type: string
        owner:
          $ref: '#/components/schemas/Customer'
        account:
          $ref: '#/components/schemas/Account'
        amount:
          type: number
          format: decimal
        description:
          type: string
        merchant:
          type: string
        accountId:
          type: string
        type:
          $ref: '#/components/schemas/TransactionType'
        status:
          $ref: '#/components/schemas/TransactionStatus'
        ownerId:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Customer:
      type: object
      properties:
        id:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        dateOfBirth:
          type: string
        status:
          $ref: '#/components/schemas/customerStatus'
        kycStatus:
          $ref: '#/components/schemas/kycStatus'
        riskStatus:
          $ref: '#/components/schemas/riskStatus'
        accountTier:
          $ref: '#/components/schemas/accountTier'
        nationalId:
          type: string
        taxId:
          type: string
        email:
          type: string
          format: email
        phoneNumber:
          type: string
        addresses:
          type: array
          items:
            $ref: '#/components/schemas/Address'
        documents:
          type: array
          items:
            $ref: '#/components/schemas/Document'
        transactions:
          type: array
          items:
            $ref: '#/components/schemas/Transaction'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Address:
      type: object
      properties:
        id:
          type: integer
        resident:
          $ref: '#/components/schemas/Customer'
        residentId:
          type: string
        street:
          type: string
        city:
          type: string
        state:
          type: string
        postalCode:
          type: string
        country:
          type: string
        type:
          $ref: '#/components/schemas/addressType'

    Document:
      type: object
      properties:
        id:
          type: string
        customer:
          $ref: '#/components/schemas/Customer'
        customerId:
          type: string
        type:
          $ref: '#/components/schemas/documentType'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        expiryDate:
          type: string
          format: date-time
          nullable: true
        verified:
          type: boolean
        notes:
          type: string

    AccountType:
      type: string
      enum:
        - CHECKING
        - SAVINGS
        - LOAN
        - MORTGAGE
        - CREDIT
        - INVESTMENT

    AccountStatus:
      type: string
      enum:
        - ACTIVE
        - INACTIVE
        - CLOSED
        - DORMANT
        - BLOCKED
        - SUSPENDED
        - DECEASED
        - MERGED

    TransactionType:
      type: string
      enum:
        - DEPOSIT
        - WITHDRAWAL
        - TRANSFER
        - PAYMENT
        - RECEIPT
        - FEE
        - CHARGE
        - REFUND
        - CREDIT
        - DEBIT
        - INTEREST
        - PENALTY

    TransactionStatus:
      type: string
      enum:
        - PENDING
        - COMPLETED
        - FAILED
        - CANCELLED
        - REVERSED
        - PENDING_REFUND
        - COMPLETED_REFUND
        - FAILED_REFUND

    documentType:
      type: string
      enum:
        - ID_PROOF
        - ADDRESS_PROOF
        - INCOME_PROOF
        - SIGNATURE
        - OTHER

    addressType:
      type: string
      enum:
        - PRIVATE
        - BUSINESS

    customerStatus:
      type: string
      enum:
        - PROSPECT
        - ONBOARDING
        - PENDING_ACTIVATION
        - ACTIVE
        - INACTIVE
        - DORMANT
        - SUSPENDED
        - BLOCKED
        - CLOSED
        - DECEASED
        - MERGED

    kycStatus:
      type: string
      enum:
        - KYC_PENDING
        - KYC_IN_PROGRESS
        - VERIFIED
        - KYC_EXPIRED
        - KYC_ON_HOLD
        - AML_FLAGGED
        - SANCTIONED
        - UNDER_INVESTIGATION

    riskStatus:
      type: string
      enum:
        - LOW_RISK
        - MEDIUM_RISK
        - HIGH_RISK
        - DELINQUENT
        - DEFAULTED
        - WRITTEN_OFF
        - UNDER_REVIEW

    accountTier:
      type: string
      enum:
        - RETAIL
        - CORPORATE
        - PRIVATE_BANKING
        - PREMIER
        - GOLD
        - PLATINUM
        - ELITE
        - HNWI
        - STUDENT
        - SENIOR
        - YOUTH

