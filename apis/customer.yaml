components:
  schemas:
    AccountType:
      type: string
      enum:
        - CHECKING
        - SAVINGS
        - LOAN
        - MORTGAGE
        - CREDIT
        - INVESTMENT
    AccountStatus:
      type: string
      enum:
        - ACTIVE
        - INACTIVE
        - CLOSED
        - DORMANT
        - BLOCKED
        - SUSPENDED
        - DECEASED
        - MERGED
    TransactionType:
      type: string
      enum:
        - DEPOSIT
        - WITHDRAWAL
        - TRANSFER
        - PAYMENT
        - RECEIPT
        - FEE
        - CHARGE
        - REFUND
        - CREDIT
        - DEBIT
        - INTEREST
        - PENALTY
    TransactionStatus:
      type: string
      enum:
        - PENDING
        - COMPLETED
        - FAILED
        - CANCELLED
        - REVERSED
        - PENDING_REFUND
        - COMPLETED_REFUND
        - FAILED_REFUND
    documentType:
      type: string
      enum:
        - ID_PROOF
        - ADDRESS_PROOF
        - INCOME_PROOF
        - SIGNATURE
        - OTHER
    addressType:
      type: string
      enum:
        - PRIVATE
        - BUSINESS
    customerStatus:
      type: string
      enum:
        - PROSPECT
        - ONBOARDING
        - PENDING_ACTIVATION
        - ACTIVE
        - INACTIVE
        - DORMANT
        - SUSPENDED
        - BLOCKED
        - CLOSED
        - DECEASED
        - MERGED
    kycStatus:
      type: string
      enum:
        - KYC_PENDING
        - KYC_IN_PROGRESS
        - VERIFIED
        - KYC_EXPIRED
        - KYC_ON_HOLD
        - AML_FLAGGED
        - SANCTIONED
        - UNDER_INVESTIGATION
    riskStatus:
      type: string
      enum:
        - LOW_RISK
        - MEDIUM_RISK
        - HIGH_RISK
        - DELINQUENT
        - DEFAULTED
        - WRITTEN_OFF
        - UNDER_REVIEW
    accountTier:
      type: string
      enum:
        - RETAIL
        - CORPORATE
        - PRIVATE_BANKING
        - PREMIER
        - GOLD
        - PLATINUM
        - ELITE
        - HNWI
        - STUDENT
        - SENIOR
        - YOUTH
    Account:
      type: object
      properties:
        id:
          type: string
        type:
          $ref: '#/components/schemas/AccountType'
        status:
          $ref: '#/components/schemas/AccountStatus'
        currency:
          type: string
        balance:
          type: number
          format: decimal
        transactions:
          type: array
          items:
            type: object
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        closedAt:
          type: string
          format: date-time
        Customer:
          type: object
          nullable: true
        customerId:
          type: string
          nullable: true
    Transaction:
      type: object
      properties:
        id:
          type: string
        owner:
          type: object
          nullable: true
        account:
          $ref: '#/components/schemas/Account'
          nullable: true
        amount:
          type: number
          format: decimal
        description:
          type: string
        merchant:
          type: string
        accountId:
          type: string
        type:
          $ref: '#/components/schemas/TransactionType'
        status:
          $ref: '#/components/schemas/TransactionStatus'
        ownerId:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Customer:
      type: object
      properties:
        id:
          type: string
        firstName:
          type: string
          nullable: true
        lastName:
          type: string
          nullable: true
        dateOfBirth:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/customerStatus'
        kycStatus:
          $ref: '#/components/schemas/kycStatus'
        riskStatus:
          $ref: '#/components/schemas/riskStatus'
        accountTier:
          $ref: '#/components/schemas/accountTier'
        taxId:
          type: string
          nullable: true
        email:
          type: string
        phoneNumber:
          type: string
          nullable: true
        addresses:
          type: array
          items:
            type: object
        documents:
          type: array
          items:
            type: object
        transactions:
          type: array
          items:
            $ref: '#/components/schemas/Transaction'
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/Account'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Address:
      type: object
      properties:
        id:
          type: integer
        resident:
          $ref: '#/components/schemas/Customer'
          nullable: true
        residentId:
          type: string
        street:
          type: string
        city:
          type: string
        state:
          type: string
        postalCode:
          type: string
        country:
          type: string
        type:
          $ref: '#/components/schemas/addressType'
    Document:
      type: object
      properties:
        id:
          type: string
        customer:
          $ref: '#/components/schemas/Customer'
          nullable: true
        customerId:
          type: string
        type:
          $ref: '#/components/schemas/documentType'
        number:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        expiryDate:
          type: string
          format: date-time
          nullable: true
        verified:
          type: boolean
        notes:
          type: string
